<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b10">
<title>温度账本 · 每一笔钱都有温度</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌡️</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<div id="app">

  <!-- ============ 侧栏（桌面） ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">🌡️</div>
      <div class="brand-txt">
        <h1>温度账本</h1>
        <p>每一笔钱都有温度</p>
      </div>
    </div>

    <nav class="sidenav">
      <button class="navitem is-active" data-view="dash"><span class="ni">◈</span>概览</button>
      <button class="navitem" data-view="flow"><span class="ni">≡</span>流水</button>
      <button class="navitem" data-view="stats"><span class="ni">▤</span>统计</button>
      <button class="navitem" data-view="report"><span class="ni">✦</span>温度报告</button>
    </nav>

    <div class="side-foot">
      <button class="ghost-btn" id="btn-budget">设置月预算</button>
      <button class="ghost-btn" id="btn-export">导出 JSON</button>
      <button class="ghost-btn" id="btn-csv">导出 CSV</button>
      <button class="ghost-btn" id="btn-import">导入 JSON</button>
      <button class="ghost-btn danger" id="btn-reset">清空重来</button>
      <input type="file" id="file-input" accept="application/json" hidden>
      <p class="side-note">数据只存在你自己的浏览器里，<br>不上传任何服务器。</p>
    </div>
  </aside>

  <!-- ============ 主区 ============ -->
  <main class="main">
    <header class="topbar">
      <div>
        <h2 id="page-title">概览</h2>
        <p id="page-sub" class="sub">—</p>
      </div>
      <div class="monthnav">
        <button class="mnav" id="m-prev" aria-label="上个月">‹</button>
        <div class="mnav-label" id="m-label">—</div>
        <button class="mnav" id="m-next" aria-label="下个月">›</button>
      </div>
    </header>

    <!-- ---------- 概览 ---------- -->
    <section class="view is-active" id="view-dash">
      <div class="grid-3">
        <div class="card stat-card">
          <span class="stat-label">本月支出</span>
          <strong class="stat-val exp" id="d-expense">¥0</strong>
          <span class="stat-foot" id="d-expense-foot">—</span>
        </div>
        <div class="card stat-card">
          <span class="stat-label">本月收入</span>
          <strong class="stat-val inc" id="d-income">¥0</strong>
          <span class="stat-foot" id="d-income-foot">—</span>
        </div>
        <div class="card stat-card">
          <span class="stat-label">结余</span>
          <strong class="stat-val" id="d-balance">¥0</strong>
          <span class="stat-foot" id="d-balance-foot">—</span>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3>预算温度</h3><span class="chip" id="d-budget-chip">未设置</span></div>
          <div class="budget-wrap">
            <div id="d-ring" class="ring-box"></div>
            <div class="budget-info">
              <p class="bi-line">已用 <b id="d-used">¥0</b> / <span id="d-total">¥—</span></p>
              <p class="bi-line dim">剩余 <b id="d-left">¥—</b> · 日均可用 <b id="d-daily">¥—</b></p>
              <p class="bi-line dim" id="d-pace">—</p>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>本月每天</h3><span class="chip" id="d-avg">日均 ¥0</span></div>
          <div id="d-spark" class="spark-box"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>最近的钱</h3><button class="link-btn" data-view="flow">查看全部 →</button></div>
        <div id="d-recent" class="recent-list"></div>
      </div>
    </section>

    <!-- ---------- 流水 ---------- -->
    <section class="view" id="view-flow">
      <div class="filterbar">
        <input type="search" id="f-search" class="inp" placeholder="搜备注 / 分类…">
        <div class="seg" id="f-type">
          <button class="seg-b is-active" data-type="all">全部</button>
          <button class="seg-b" data-type="expense">支出</button>
          <button class="seg-b" data-type="income">收入</button>
        </div>
        <select id="f-cat" class="inp"><option value="all">全部分类</option></select>
        <select id="f-temp" class="inp">
          <option value="all">全部温度</option>
          <option value="2">滚烫 🔥</option>
          <option value="1">温热 ☀︎</option>
          <option value="0">平淡 ·</option>
          <option value="-1">微凉 ﹀</option>
          <option value="-2">冰冷 ❄︎</option>
        </select>
      </div>
      <div class="card">
        <div id="f-list" class="flow-list"></div>
      </div>
    </section>

    <!-- ---------- 统计 ---------- -->
    <section class="view" id="view-stats">
      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3>分类占比</h3><span class="chip" id="s-cat-chip">—</span></div>
          <div class="donut-row">
            <div id="s-donut"></div>
            <div id="s-legend" class="legend"></div>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>近 6 个月</h3><span class="chip">柱=支出 线=收入</span></div>
          <div id="s-trend"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>支出排行</h3><span class="chip">按金额</span></div>
        <div id="s-rank" class="rank-list"></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>消费热力图</h3><span class="chip">近 16 周</span></div>
        <div id="s-heat" class="heat-box"></div>
      </div>
    </section>

    <!-- ---------- 温度报告 ---------- -->
    <section class="view" id="view-report">
      <div class="card hero">
        <div class="hero-temp">
          <span class="ht-label">本月消费体温</span>
          <strong id="r-temp-val">—</strong>
          <span class="ht-desc" id="r-temp-desc">—</span>
        </div>
        <div id="r-gauge" class="hero-gauge"></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>账本说</h3><span class="chip">自动生成</span></div>
        <div id="r-insights" class="insight-list"></div>
      </div>
      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3>分类温度</h3><span class="chip">越靠右越值</span></div>
          <div id="r-tempbars" class="tbars"></div>
        </div>
        <div class="card">
          <div class="card-head"><h3>温度分布</h3><span class="chip">按笔数</span></div>
          <div id="r-dist" class="dist-box"></div>
        </div>
      </div>
      <div class="grid-2">
        <div class="card pole pole-hot">
          <div class="card-head"><h3>🔥 最值的一笔</h3></div>
          <div id="r-best" class="pole-body"></div>
        </div>
        <div class="card pole pole-cold">
          <div class="card-head"><h3>❄️ 最后悔的一笔</h3></div>
          <div id="r-worst" class="pole-body"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- ============ 移动端底部导航 ============ -->
  <nav class="tabbar">
    <button class="tab is-active" data-view="dash"><span>◈</span>概览</button>
    <button class="tab" data-view="flow"><span>≡</span>流水</button>
    <button class="tab tab-add" id="fab"><span>＋</span></button>
    <button class="tab" data-view="stats"><span>▤</span>统计</button>
    <button class="tab" data-view="report"><span>✦</span>报告</button>
  </nav>
  <button class="fab-desk" id="fab2" aria-label="记一笔">＋ 记一笔</button>
</div>

<!-- ============ 记一笔 抽屉 ============ -->
<div class="sheet-mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grab"></div>
  <div class="sheet-head">
    <h3 id="sheet-title">记一笔</h3>
    <button class="x-btn" id="sheet-close">×</button>
  </div>

  <div class="seg sheet-seg" id="a-type">
    <button class="seg-b is-active" data-type="expense">支出</button>
    <button class="seg-b" data-type="income">收入</button>
  </div>

  <div class="amount-display">
    <span class="cur">¥</span><span id="a-amount">0</span><span class="caret"></span>
  </div>

  <div class="cat-grid" id="a-cats"></div>

  <div class="temp-pick" id="a-temp">
    <div class="tp-label">花完之后，你感觉…</div>
    <div class="tp-row">
      <button class="tp" data-t="-2"><i>❄️</i>冰冷</button>
      <button class="tp" data-t="-1"><i>🌤</i>微凉</button>
      <button class="tp is-active" data-t="0"><i>•</i>平淡</button>
      <button class="tp" data-t="1"><i>☀︎</i>温热</button>
      <button class="tp" data-t="2"><i>🔥</i>滚烫</button>
    </div>
  </div>

  <div class="sheet-fields">
    <input type="text" id="a-note" class="inp" placeholder="备注（可选）" maxlength="40">
    <input type="date" id="a-date" class="inp">
  </div>

  <div class="keypad" id="a-keys">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k=".">.</button><button data-k="0">0</button><button data-k="del" class="k-del">⌫</button>
  </div>

  <button class="save-btn" id="a-save">记下这一笔</button>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
